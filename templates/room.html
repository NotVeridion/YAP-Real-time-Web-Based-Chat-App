{% extends 'base.html' %}
{% block content %}
<button class="disconnect-button" onclick="disconnect()">Disconnect</button>
<div class="room-page-flexbox">
<h2 class="room-code-display">Room Code: {{code}}</h2>
    <div class="room-flexbox">
        <div class="room-container-left">
            <div class="user-list" id="user-list">
                <div class="user-item">user</div>
            </div>   

            <div id="customize-panel" class="customize-panel">
                <div class="customize-panel-title">Colors</div>
                <div class="customize-panel-body">
                    <!-- ill add color functionality later -->
                    <div class="color-option" data-color="#6ee7e8"></div>
                    <div class="color-option" data-color="#6d28d9"></div>
                    <div class="color-option" data-color="#f2c94c"></div>
                    <div class="color-option" data-color="#d96aa7"></div>

                    <div class="color-option" data-color="#deff7d"></div>
                    <div class="color-option" data-color="#ff2b2b"></div>
                    <div class="color-option" data-color="#62f58a"></div>
                    <div class="color-option" data-color="#6ca8ff"></div>
                </div>
            </div>
            <button class="customize-button" onclick="toggleCustomize()"> Customize </button>
        </div>
        <div class="room-flexbox-right">
            <div class="chat-box" id="chat-box"></div>
            <div class="chat-input-flexbox">
                <input class="chat-input" placeholder="Start YAPPING!" id="chat-input"/>
                <button class="chat-send-button" onClick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</div>

<style>
    .chat-item-me {
        display: flex;
        justify-content: flex-end;
        text-align: right;
        margin: 4px 8px;
    }

    .chat-item-other {
        display: flex;
        justify-content: flex-start;
        text-align: left;
        margin: 4px 8px;
    }

    .chat-item-system {
        display: flex;
        justify-content: center;
        text-align: center;
        margin: 4px 8px;
        opacity: 0.7;
        font-style: italic;
    }
</style>

<script>
    const socket = io();

    const username = "{{ name }}"
    const CHATBOX_MESSAGE_LIMIT = 25;
    const chatBox = document.getElementById("chat-box");
    const userList = document.getElementById("user-list");
    const input = document.getElementById("chat-input");
    var users = [];

    // Server-to-client: New user has joined the room
    socket.on("user_connected", (data) => {
        chatBox.innerHTML += `
        <div class="chat-item chat-item-system">
            <span class="chat-username">${data.name}:</span>&nbsp;joined the room
        </div>`;

        users = data.users;
        
        userList.innerHTML = "";
        users.forEach((user) => {
            userList.innerHTML += `<div class="user-item" id="${user}">${user}</div>`;
        });
    });

    // Server-to-client: A user has disconnected from the room
    socket.on("user_disconnected", (data) => {
        users = data.users;

        userList.innerHTML = "";
        users.forEach((user) => {
            userList.innerHTML += `<div class="user-item" id="${user}">${user}</div>`;
        });

        chatBox.innerHTML += `
        <div class="chat-item chat-item-system">
            <span class="chat-username">${data.name}:</span>&nbsp;has disconnected
        </div>`;
    });

    // Server-to-client: receive and display incoming messages
    socket.on("message", (data) => {
        const isMe = data.name === username;
        chatBox.innerHTML += `
        <div style="width:100%; display:flex; justify-content:${isMe ? 'flex-end' : 'flex-start'};">
            <div class="chat-item">
                <span class="chat-username">${data.name}:</span>&nbsp;${data.message}
            </div>
        </div>`;

        while (chatBox.children.length > CHATBOX_MESSAGE_LIMIT){
            chatBox.removeChild(chatBox.firstChild)
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Server-to-client: receive message history on join
    socket.on("message_history", (data) => {
        data.messages.forEach((msg) => {
            const isMe = msg.name === username;
            chatBox.innerHTML += `
            <div style="width:100%; display:flex; justify-content:${isMe ? 'flex-end' : 'flex-start'};">
                <div class="chat-item">
                    <span class="chat-username">${msg.name}:</span>&nbsp;${msg.message}
                </div>
            </div>`;

            while (chatBox.children.length > CHATBOX_MESSAGE_LIMIT){
                chatBox.removeChild(chatBox.firstChild)
            }
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter"){
            sendMessage();
        }
    });

    const sendMessage = () => {
        const message = input.value;
        if (message == "") return;

        // FIX: removed local chatBox append here — server now sends to everyone
        // including self, so the message event above handles display for all users

        socket.emit("message", {data: message});
        input.value = "";
    }

    //for the customize button popup
    function toggleCustomize() {
        const panel = document.getElementById("customize-panel");

        if (panel.style.display === "block") {
            panel.style.display = "none";
        } else {
            panel.style.display = "block";
        }
    }

    //for saving the selected color
    //wll have to be tested
    let currentUserColor = "#808080";
    
    document.querySelectorAll(".color-option").forEach(option => {
        option.addEventListener("click", () => {
            currentUserColor = option.dataset.color;
        });
    });

    //going back to the home page
    function disconnect() {
        window.location.href = "/";
    }

    if (window.history.replaceState) {
        // This overwrites the current history entry
        window.history.replaceState(null, null, window.location.href);
    }
</script>
{% endblock %}
