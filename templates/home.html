{% extends 'base.html' %}
{% block content %}
<form method="post" class="homeForm">
    <img src="{{url_for('static', filename='assets/images/YAP-logo-1148x970.webp')}}" class="homeLogo"></img>
    {% if error %}<p class="error-message">{{ error }}</p>{% endif %}
    <p id="error-message" class="error-message"></p>
    <div class="inputGroup">
        <label class="inputLabel">Username:</label>
        <input class="inputText" type="text" placeholder="Enter username: " name="name" value="{{name}}" maxlength="15"/>
    </div>

    <div class="inputGroup">
        <label class="inputLabel">Room Code:</label>
        <input class="inputText" type="text" placeholder="Enter room code" name="code" value="{{code}}" maxlength="4" oninput="this.value = this.value.replace(/[^A-Z]/g, '').toUpperCase()"/>
        <button class="buttonJoin" type="submit" name="join">Join a Room</button>
    </div>
    <button class="buttonCreate" type="submit" name="create">Create a Room</button>
</form>

<script>
document.querySelector(".homeForm").addEventListener("submit", function(e) {
    const name = document.querySelector('input[name="name"]').value.trim();
    const code = document.querySelector('input[name="code"]').value.trim().toUpperCase();
    const error = document.getElementById("error-message");

    error.textContent = "";

    if (!name) {
        e.preventDefault();
        error.textContent = "Please enter a username.";
        return;
    }

    if (name.length > 15) {
        e.preventDefault();
        error.textContent = "Username must be 15 characters or less.";
        return;
    }

    if (!/^[a-zA-Z0-9 _-]+$/.test(name)) {
    e.preventDefault();
    error.textContent = "Username must be letters, numbers, spaces, underscores, or dashes only.";
    return;
}

    const clickedButton = e.submitter;

    if (clickedButton && clickedButton.name === "join") {
        if (!code) {
            e.preventDefault();
            error.textContent = "Please enter a room code to join.";
            return;
        }
        if (!/^[A-Z]{4}$/.test(code)) {
            e.preventDefault();
            error.textContent = "Room code must be exactly 4 capital letters.";
            return;
        }
    }
});
</script>
{% endblock %}
