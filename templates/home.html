{% extends 'base.html' %}
{% block content %}
<form method="post ">
    <h3>Enter the Chat Room</h3>
    <div>
        <label>Username:</label>
        <input type="text" placeholder="Enter username: " name="name" value="{{name}}"/>
    </div>
    <div class="join">
        <input type="text" placeholder="Enter roomcode" name="code" value="{{code}}"/>
        <button type="submit" name="join">Join a Room</button>
    </div>
    <button type="submit" name="create">Create a Room</button>
</form>
{% endblock %}
